server {
  listen 80;

  resolver 127.0.0.11 valid=10s ipv6=off;

  client_max_body_size 1024m;
  client_body_timeout 600s;
  send_timeout 600s;

  proxy_connect_timeout 60s;
  proxy_send_timeout 600s;
  proxy_read_timeout 600s;

  proxy_request_buffering off;
  proxy_buffering off;
  
  

  location /nkosi/ {
    set $upstream http://nkosi-app:8000;
    proxy_pass $upstream/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /dumi/ {
    set $upstream http://dumi-app:8000;
    proxy_pass $upstream/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /hlayi/ {
    set $upstream http://hlayi-app:8000;
    proxy_pass $upstream/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /bev/ {
    set $upstream http://bev-app:8000;
    proxy_pass $upstream/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /phpmyadmin {
      return 301 $scheme://$http_host/phpmyadmin/;
  }

  location ^~ /phpmyadmin/ {
      rewrite ^/phpmyadmin/(.*)$ /$1 break;
      proxy_pass http://phpmyadmin:80;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /siya {
      return 301 $scheme://$http_host/siya/;
  }

  location /siya/ {
    proxy_pass http://siya-app:8000/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
  }

  default_type text/html;

  location = /login {
    return 302 $scheme://$http_host/bfrn/login;
  }


  location = /access {
    default_type text/html;
    return 200 '
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>1Office Server Access</title>
  <style>
    body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#111827}
    .wrap{max-width:1120px;margin:0 auto;padding:36px 18px}
    .hero{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:26px;box-shadow:0 8px 22px rgba(15,23,42,.06);margin-bottom:18px}
    h1{margin:0;font-size:30px}.muted{color:#6b7280}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px;text-decoration:none;color:#111827;box-shadow:0 5px 16px rgba(15,23,42,.04)}
    .card:hover{border-color:#2563eb}.name{font-weight:800;font-size:17px;margin-bottom:6px}
    .url{font-size:13px;color:#2563eb;word-break:break-all}.desc{font-size:13px;color:#6b7280;margin-top:8px;line-height:1.4}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1>1Office Server Access</h1>
      <p class="muted">Central access page for internal Docker services.</p>
    </section>
    <section class="grid">
      <a class="card" href="/bfrn/login"><div class="name">BFRN Login</div><div class="url">/bfrn/login</div><div class="desc">Main BFRN login page.</div></a>
      <a class="card" href="/bfrn/"><div class="name">BFRN System</div><div class="url">/bfrn/</div><div class="desc">BFRN operations system.</div></a>
      <a class="card" href="http://192.168.1.9:8091"><div class="name">Auth Gateway</div><div class="url">:8091</div><div class="desc">Email login and supervisor approval.</div></a>
      <a class="card" href="/siya/"><div class="name">Siya Service</div><div class="url">/siya/</div><div class="desc">Siya application and API service.</div></a>
      <a class="card" href="/phpmyadmin/"><div class="name">phpMyAdmin</div><div class="url">/phpmyadmin/</div><div class="desc">Database administration.</div></a>
      <a class="card" href="http://192.168.1.9:9000"><div class="name">Portainer</div><div class="url">:9000</div><div class="desc">Docker management dashboard.</div></a>
    </section>
  </main>
</body>
</html>';
  }


  location = /_auth {
    return 404;
  }


  error_page 401 = @login;
  location @login {
    return 302 $scheme://$http_host/bfrn/login;
  }


  location = / {
    return 302 $scheme://$http_host/bfrn/operations/dashboard;
  }


  location = /logout {
    return 302 $scheme://$http_host/bfrn/login;
  }


  location = /bfrn {
    return 301 $scheme://$http_host/bfrn/;
  }

  location /bfrn/ {
    set $upstream http://bfrn-nginx:80;
    proxy_pass $upstream;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
  }

  location /api/ {
    set $upstream http://auth-service:8009;
    proxy_pass $upstream;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /oauth2/ {
    set $upstream http://oauth2-proxy:4180;
    proxy_pass $upstream;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /static/ {
    set $upstream http://auth-service:8009;
    proxy_pass $upstream/static/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /favicon.ico {
    set $upstream http://auth-service:8009;
    proxy_pass $upstream/favicon.ico;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}