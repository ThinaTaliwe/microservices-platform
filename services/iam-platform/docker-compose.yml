services:
  iam-platform-php:
    build:
      context: .
      dockerfile: docker/Dockerfile.fpm
    container_name: iam-platform-php
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      - iam-platform-mysql
    networks:
      - iam-platform-net
      - bfrn-internal-net

  iam-platform-nginx:
    image: nginx:1.27-alpine
    container_name: iam-platform-nginx
    ports:
      - "8092:80"
    volumes:
      - .:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - iam-platform-php
    networks:
      - iam-platform-net
      - bfrn-internal-net

  iam-platform-mysql:
    image: mysql:8.4
    container_name: iam-platform-mysql
    environment:
      MYSQL_DATABASE: iam_platform
      MYSQL_USER: iam_platform
      MYSQL_PASSWORD: ${IAM_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${IAM_DB_ROOT_PASSWORD}
    volumes:
      - iam_platform_mysql_data:/var/lib/mysql
      - ./database/schema/auth_gateway.sql:/docker-entrypoint-initdb.d/001-auth-gateway.sql:ro
    networks:
      - iam-platform-net

volumes:
  iam_platform_mysql_data:

networks:
  iam-platform-net:
    name: iam-platform-net

  bfrn-internal-net:
    external: true
    name: microservices-platform_internal
